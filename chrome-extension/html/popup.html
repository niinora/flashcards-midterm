<!DOCTYPE html>
<html>

<head>
    <title>Flashcards</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }

        .field-label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }

        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 60px;
            resize: vertical;
            box-sizing: border-box;
        }

        .tags-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #saveButton {
            background-color: #4a6da7;
            color: white;
        }

        #clearButton {
            background-color: #6c757d;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .view-cards {
            text-align: center;
            margin-top: 10px;
        }

        .view-cards a {
            color: #4a6da7;
            text-decoration: none;
            font-size: 0.9em;
        }

        .view-cards a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h2>Create Flashcard</h2>
    <div class="field-label">Front:</div>
    <textarea id="frontText" placeholder="Enter the front of the flashcard"></textarea>

    <div class="field-label">Back:</div>
    <textarea id="backText" placeholder="Enter the back of the flashcard"></textarea>

    <div class="field-label">Tags (comma separated):</div>
    <input type="text" id="tagsText" class="tags-input" placeholder="e.g. noun, german">

    <div class="button-container">
        <button id="saveButton">Save Card</button>
        <button id="clearButton">Clear</button>
    </div>

    <div class="view-cards">
        <a href="#" id="viewCardsLink">View Saved Flashcards</a>
    </div>
</body>

<script src="../js/popup.js"></script>

</html>
